name: Daily Screening

on:
  schedule:
    - cron: "45 6 * * 1-5" # 06:45 UTC = 15:45 JST, Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-screening
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r code/requirements.txt

      - name: Run screening
        working-directory: code
        run: python run_daily.py

      - name: Commit results (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "data: screening results $(date -u +%F)"
            git push
          fi
